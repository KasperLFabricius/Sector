schema_version = 1

[audit]
requirements = [
    "requirements-dev.txt",
    "requirements-build.txt",
]
service = "pypi"
strict = true
require_hashes = true
disable_pip = true
isolated_python = true
output_format = "json"
descriptions = "off"
aliases = "on"
spinner = "off"
timeout_seconds = 15
report_path = "qa-artifacts/dependency-audit.json"
cache_path = ".qa-cache/pip-audit"
ignored_vulnerabilities = []

# Owner-approved exception (2026-11-03). It accepts only these advisory IDs at
# these locked versions and ends after 2026-11-30.
[audit.advisory_exception]
approved = "Owner approval in the coordinating session on 2026-11-03"
reason = "Pillow 13 needs Streamlit 1.66. The module updates are planned for the 0.97.1 dependency refresh."
expires = 2026-11-30

