schema_version = 1

[audit]
requirements = [
    "requirements-dev.txt",
    "requirements-build.txt",
]
service = "pypi"
strict = true
require_hashes = true
disable_pip = true
isolated_python = true
output_format = "json"
descriptions = "off"
aliases = "on"
spinner = "off"
timeout_seconds = 15
report_path = "qa-artifacts/dependency-audit.json"
cache_path = ".qa-cache/pip-audit"
ignored_vulnerabilities = []
