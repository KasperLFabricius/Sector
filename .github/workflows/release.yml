name: Signed Sector Windows release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sector-signed-release
  cancel-in-progress: false

jobs:
  signed-windows-release:
    name: Build, sign and verify Sector for Windows
    environment: sector-production-signing
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out exact source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Preflight genuine signing authority
        env:
          SECTOR_SIGNING_CERTIFICATE_PFX_BASE64: ${{ secrets.SECTOR_SIGNING_CERTIFICATE_PFX_BASE64 }}
          SECTOR_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SECTOR_SIGNING_CERTIFICATE_PASSWORD }}
          SECTOR_EXPECTED_SIGNER_SUBJECT: ${{ secrets.SECTOR_EXPECTED_SIGNER_SUBJECT }}
          SECTOR_EXPECTED_SIGNER_THUMBPRINT: ${{ secrets.SECTOR_EXPECTED_SIGNER_THUMBPRINT }}
          SECTOR_RELEASE_REF: ${{ github.ref }}
          SECTOR_RELEASE_SHA: ${{ github.sha }}
        run: python tools/verify_windows_release.py --preflight-signing

      - name: Install locked build environment
        run: python -m pip install --require-hashes -r requirements-build.txt

      - name: Validate signed-release policy
        run: python tools/verify_windows_release.py --workflow .github/workflows/release.yml

      - name: Generate exact legal notices
        run: python tools/generate_third_party_notices.py --output build/legal/THIRD_PARTY_NOTICES.txt

      - name: Build provenance-bound Windows package
        env:
          SECTOR_SOURCE_REVISION: ${{ github.sha }}
        run: python -m PyInstaller --noconfirm --clean packaging/sector.spec

      - name: Assemble legal package files
        shell: pwsh
        run: |-
          Copy-Item -LiteralPath LICENSE -Destination dist/Sector/LICENSE.txt -Force
          Copy-Item -LiteralPath build/legal/THIRD_PARTY_NOTICES.txt -Destination dist/Sector/THIRD_PARTY_NOTICES.txt -Force

      - name: Authenticode sign Sector executable
        shell: pwsh
        env:
          SECTOR_SIGNING_CERTIFICATE_PFX_BASE64: ${{ secrets.SECTOR_SIGNING_CERTIFICATE_PFX_BASE64 }}
          SECTOR_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SECTOR_SIGNING_CERTIFICATE_PASSWORD }}
        run: |-
          $ErrorActionPreference = "Stop"
          $certificatePath = Join-Path $env:RUNNER_TEMP "sector-signing.pfx"
          try {
            $certificateBytes = [Convert]::FromBase64String(
              $env:SECTOR_SIGNING_CERTIFICATE_PFX_BASE64
            )
            [IO.File]::WriteAllBytes($certificatePath, $certificateBytes)
            $signTool = Get-ChildItem -LiteralPath "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
              -Filter signtool.exe -Recurse |
              Where-Object { $_.Directory.Name -eq 'x64' } |
              Sort-Object FullName -Descending |
              Select-Object -First 1
            if ($null -eq $signTool) {
              throw "A Windows x64 signtool.exe was not found"
            }
            & $signTool.FullName sign /fd SHA256 /td SHA256 `
              /tr https://timestamp.digicert.com `
              /f $certificatePath `
              /p $env:SECTOR_SIGNING_CERTIFICATE_PASSWORD `
              dist/Sector/Sector.exe
            if ($LASTEXITCODE -ne 0) {
              throw "Authenticode signing failed with exit code $LASTEXITCODE"
            }
          }
          finally {
            if (Test-Path -LiteralPath $certificatePath) {
              Remove-Item -LiteralPath $certificatePath -Force
            }
          }

      - name: Verify signed package identity and provenance
        env:
          SECTOR_EXPECTED_SIGNER_SUBJECT: ${{ secrets.SECTOR_EXPECTED_SIGNER_SUBJECT }}
          SECTOR_EXPECTED_SIGNER_THUMBPRINT: ${{ secrets.SECTOR_EXPECTED_SIGNER_THUMBPRINT }}
          SECTOR_SOURCE_REVISION: ${{ github.sha }}
        run: python tools/verify_windows_release.py --verify-package dist/Sector --source-revision $env:SECTOR_SOURCE_REVISION

      - name: Upload verified signed Windows package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Sector-Windows-signed
          path: dist/Sector/
          if-no-files-found: error
          retention-days: 7
