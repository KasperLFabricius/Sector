name: Sector protected signed Windows release

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact accepted main commit to sign
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sector-protected-signed-release
  cancel-in-progress: false

jobs:
  signed-windows-release:
    name: Protected signed Windows release
    runs-on: windows-latest
    timeout-minutes: 60
    environment:
      name: sector-production-signing

    steps:
      - name: Check out exact requested source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 0

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Preflight release policy without dependencies
        run: >-
          python -I -S tools/verify_windows_release.py --preflight
          --workflow .github/workflows/release-windows.yml
          --signing-script packaging/sign_and_verify.ps1
          --build-input requirements-build.in
          --build-lock requirements-build.txt

      - name: Install locked build environment
        run: python -m pip install --require-hashes -r requirements-build.txt

      - name: Validate protected release policy
        run: >-
          python tools/verify_windows_release.py
          --workflow .github/workflows/release-windows.yml
          --signing-script packaging/sign_and_verify.ps1
          --build-input requirements-build.in
          --build-lock requirements-build.txt

      - name: Require exact current main commit
        shell: pwsh
        env:
          SECTOR_RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          $requested = $env:SECTOR_RELEASE_SOURCE_SHA
          if ($requested -cnotmatch "^[0-9a-f]{40}$") {
            throw "source_sha must be an exact lowercase 40-hex commit"
          }
          git fetch origin main --no-tags
          $headRevision = (git rev-parse HEAD).Trim()
          $mainRevision = (git rev-parse origin/main).Trim()
          if ($headRevision -cne $requested -or $mainRevision -cne $requested) {
            throw "Protected release source is not exact current main"
          }

      - name: Build protected release payload
        shell: pwsh
        env:
          SECTOR_SOURCE_REVISION: ${{ inputs.source_sha }}
        run: |
          python tools/generate_third_party_notices.py --output build/legal/THIRD_PARTY_NOTICES.txt
          python -m PyInstaller --noconfirm --clean packaging/sector.spec
          Copy-Item -LiteralPath LICENSE -Destination dist/Sector/LICENSE.txt -Force
          Copy-Item -LiteralPath build/legal/THIRD_PARTY_NOTICES.txt -Destination dist/Sector/THIRD_PARTY_NOTICES.txt -Force

      - name: Sign and verify protected release
        shell: pwsh
        env:
          SECTOR_RELEASE_SOURCE_SHA: ${{ inputs.source_sha }}
          SECTOR_SIGNING_CERTIFICATE_BASE64: ${{ secrets.SECTOR_SIGNING_CERTIFICATE_BASE64 }}
          SECTOR_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SECTOR_SIGNING_CERTIFICATE_PASSWORD }}
          SECTOR_SIGNING_CERTIFICATE_THUMBPRINT: ${{ secrets.SECTOR_SIGNING_CERTIFICATE_THUMBPRINT }}
          SECTOR_SIGNING_CERTIFICATE_SUBJECT: ${{ secrets.SECTOR_SIGNING_CERTIFICATE_SUBJECT }}
        run: >-
          & packaging/sign_and_verify.ps1
          -PackageDirectory dist/Sector
          -SourceRevision $env:SECTOR_RELEASE_SOURCE_SHA

      - name: Upload verified signed release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Sector-Windows-signed-${{ inputs.source_sha }}
          path: dist/Sector/
          if-no-files-found: error
          retention-days: 7
