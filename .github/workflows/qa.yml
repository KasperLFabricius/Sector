name: Sector QA

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sector-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Full test and report gate
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install locked QA environment
        run: python -m pip install --require-hashes -r requirements-dev.txt

      - name: Prepare QA evidence directory
        shell: pwsh
        run: New-Item -ItemType Directory -Path qa-artifacts -Force | Out-Null

      - name: Validate ratcheted quality-gate policy
        run: python tools/qa_gate_policy.py quality-gates.toml --workflow .github/workflows/qa.yml

      - name: Run repository-wide fatal Ruff checks
        run: python -m ruff check app sector tools tests --select E9,F63,F7,F82

      - name: Run selected strict Ruff checks
        run: python -m ruff check sector/capacity.py tests/test_capacity.py tests/test_project_io.py --select E4,E7,E9,F,I --ignore E402

      - name: Run strict typed-boundary checks
        run: python -m mypy --strict sector/bridge.py app/bridge_analysis.py app/manual_equation_contract.py app/manual_equation_publication.py

      - name: Audit the hash-locked dependency set
        run: python -m pip_audit --strict --require-hashes --disable-pip -r requirements-dev.txt --progress-spinner off

      - name: Run complete test suite
        run: python -m pytest tests -n 4 --cov=app --cov=sector --cov-report=term-missing:skip-covered --cov-report=xml:qa-artifacts/coverage.xml --cov-fail-under=50 --junitxml=qa-artifacts/test-results.xml

      - name: Render report fixture with real figures
        if: always()
        run: python tools/report_render_fixture.py --output qa-artifacts/report

      - name: Render manual fixture with real figures
        if: always()
        run: python tools/manual_render_fixture.py --output qa-artifacts/manual

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sector-qa-evidence
          path: qa-artifacts/
          if-no-files-found: error
          retention-days: 14

  windows-package:
    name: Reproducible Windows package
    needs: test
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install locked build environment
        run: python -m pip install --require-hashes -r requirements-build.txt

      - name: Build Sector
        shell: pwsh
        run: |
          python tools/generate_third_party_notices.py --output build/legal/THIRD_PARTY_NOTICES.txt
          python -m PyInstaller --noconfirm --clean packaging/sector.spec
          Copy-Item -LiteralPath LICENSE -Destination dist/Sector/LICENSE.txt -Force
          Copy-Item -LiteralPath build/legal/THIRD_PARTY_NOTICES.txt -Destination dist/Sector/THIRD_PARTY_NOTICES.txt -Force

      - name: Verify package contents
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath "dist/Sector/Sector.exe")) {
            throw "Sector.exe was not produced"
          }
          if (-not (Test-Path -LiteralPath "dist/Sector/_internal/app/sector_app.py")) {
            throw "Packaged app source is missing"
          }
          if (-not (Test-Path -LiteralPath "dist/Sector/_internal/sector/__init__.py")) {
            throw "Packaged numerical core is missing"
          }
          if (-not (Test-Path -LiteralPath "dist/Sector/_internal/sector/sector_build_info.json")) {
            throw "Packaged source-provenance manifest is missing"
          }
          if (-not (Test-Path -LiteralPath "dist/Sector/LICENSE.txt")) {
            throw "Sector proprietary notice is missing"
          }
          if (-not (Test-Path -LiteralPath "dist/Sector/THIRD_PARTY_NOTICES.txt")) {
            throw "Third-party notice bundle is missing"
          }

      - name: Upload Windows package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Sector-Windows
          path: dist/Sector/
          if-no-files-found: error
          retention-days: 7
