name: Sector QA

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sector-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Full test and report gate
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Preflight locked dependency inputs
        run: python tools/verify_dependency_audit.py quality-dependency-audit.toml --preflight-locks

      - name: Install locked QA environment
        run: python -m pip install --require-hashes -r requirements-dev.txt

      - name: Prepare QA evidence directory
        shell: pwsh
        run: New-Item -ItemType Directory -Path qa-artifacts -Force | Out-Null

      - name: Validate consolidated publication gate
        run: python tools/verify_consolidated_publication_gate.py .github/workflows/qa.yml

      - name: Validate dependency audit policy
        env:
          SECTOR_DEPENDENCY_AUDIT_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: python tools/verify_dependency_audit.py quality-dependency-audit.toml --workflow .github/workflows/qa.yml --baseline-ref $env:SECTOR_DEPENDENCY_AUDIT_BASE

      - name: Execute locked dependency audit
        run: python tools/verify_dependency_audit.py quality-dependency-audit.toml --execute

      - name: Validate non-shrinking coverage gate
        env:
          SECTOR_COVERAGE_BASELINE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: python tools/verify_coverage_gate.py quality-coverage-gate.toml --workflow .github/workflows/qa.yml --baseline-ref $env:SECTOR_COVERAGE_BASELINE_REF

      - name: Validate Ruff policy ratchet
        env:
          SECTOR_RUFF_POLICY_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: python tools/verify_ruff_policy.py quality-ruff-policy.toml --workflow .github/workflows/qa.yml --baseline-ref $env:SECTOR_RUFF_POLICY_BASE

      - name: Execute Ruff policy
        run: python tools/verify_ruff_policy.py quality-ruff-policy.toml --execute

      - name: Validate mypy policy ratchet
        env:
          SECTOR_MYPY_POLICY_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: python tools/verify_mypy_policy.py quality-mypy-policy.toml --workflow .github/workflows/qa.yml --baseline-ref $env:SECTOR_MYPY_POLICY_BASE

      - name: Execute strict mypy policy
        run: python tools/verify_mypy_policy.py quality-mypy-policy.toml --execute

      - name: Run complete test suite with coverage
        run: python -m pytest tests -n 4 --cov=app --cov=sector --cov-report=term-missing:skip-covered --cov-report=xml:qa-artifacts/coverage.xml --cov-fail-under=90 --junitxml=qa-artifacts/test-results.xml

      - name: Render report fixture with real figures
        if: always()
        run: python tools/report_render_fixture.py --output qa-artifacts/report

      - name: Render manual fixture with real figures
        if: always()
        run: python tools/manual_render_fixture.py --output qa-artifacts/manual

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sector-qa-evidence
          path: qa-artifacts/
          if-no-files-found: error
          retention-days: 14

  windows-package:
    name: Unsigned QA Windows package
    needs: test
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Build first unsigned QA package from exact exported source
        shell: pwsh
        env:
          SECTOR_SOURCE_REVISION: ${{ github.sha }}
          SECTOR_EXACT_BUILD_ROOT: qa-artifacts/windows-package-${{ github.run_id }}-${{ github.run_attempt }}-build-a
        run: |
          Write-Warning "TWO UNSIGNED QA PACKAGES ONLY. Do not launch or distribute either artifact."
          python -I -S tools/build_exact_commit.py `
            --root . `
            --source-revision $env:SECTOR_SOURCE_REVISION `
            --output $env:SECTOR_EXACT_BUILD_ROOT
          "SECTOR_PACKAGE_ROOT_A=$env:SECTOR_EXACT_BUILD_ROOT\dist\Sector" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SECTOR_SOURCE_IDENTITY_A=$env:SECTOR_EXACT_BUILD_ROOT\source-identity.json" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build second unsigned QA package from exact exported source
        shell: pwsh
        env:
          SECTOR_SOURCE_REVISION: ${{ github.sha }}
          SECTOR_EXACT_BUILD_ROOT: qa-artifacts/windows-package-${{ github.run_id }}-${{ github.run_attempt }}-build-b
        run: |
          python -I -S tools/build_exact_commit.py `
            --root . `
            --source-revision $env:SECTOR_SOURCE_REVISION `
            --output $env:SECTOR_EXACT_BUILD_ROOT
          "SECTOR_PACKAGE_ROOT_B=$env:SECTOR_EXACT_BUILD_ROOT\dist\Sector" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SECTOR_SOURCE_IDENTITY_B=$env:SECTOR_EXACT_BUILD_ROOT\source-identity.json" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify both unsigned QA package identities
        shell: pwsh
        run: |
          python -I -S tools/verify_windows_release.py `
            --root . `
            --package $env:SECTOR_PACKAGE_ROOT_A `
            --source-revision $env:GITHUB_SHA `
            --source-identity $env:SECTOR_SOURCE_IDENTITY_A
          python -I -S tools/verify_windows_release.py `
            --root . `
            --package $env:SECTOR_PACKAGE_ROOT_B `
            --source-revision $env:GITHUB_SHA `
            --source-identity $env:SECTOR_SOURCE_IDENTITY_B
          $packageRoot = $env:SECTOR_PACKAGE_ROOT_A
          if (-not (Test-Path -LiteralPath "$packageRoot/Sector.exe")) {
            throw "Sector.exe was not produced"
          }
          if (-not (Test-Path -LiteralPath "$packageRoot/_internal/app/sector_app.py")) {
            throw "Packaged app source is missing"
          }
          if (-not (Test-Path -LiteralPath "$packageRoot/_internal/sector/__init__.py")) {
            throw "Packaged numerical core is missing"
          }
          if (-not (Test-Path -LiteralPath "$packageRoot/_internal/sector/sector_build_info.json")) {
            throw "Packaged source-provenance manifest is missing"
          }
          if (-not (Test-Path -LiteralPath "$packageRoot/LICENSE.txt")) {
            throw "Sector proprietary notice is missing"
          }
          if (-not (Test-Path -LiteralPath "$packageRoot/THIRD_PARTY_NOTICES.txt")) {
            throw "Third-party notice bundle is missing"
          }

          $versionInfo = (Get-Item -LiteralPath "$packageRoot/Sector.exe").VersionInfo
          $expectedVersionInfo = [ordered]@{
            ProductName = "Sector"
            FileDescription = "Structural-analysis and design calculation tool"
            FileVersion = "0.92.0.0"
            ProductVersion = "0.92.0.0"
            OriginalFilename = "Sector.exe"
            LegalCopyright = "Copyright (c) 2026 Kasper Lindskov Fabricius. All rights reserved."
          }
          foreach ($field in $expectedVersionInfo.Keys) {
            if ([string]$versionInfo.$field -ne [string]$expectedVersionInfo[$field]) {
              throw "Unexpected Windows identity field $field"
            }
          }
          if (-not [string]::IsNullOrWhiteSpace([string]$versionInfo.CompanyName)) {
            throw "Sector.exe must not advertise a company or publisher identity"
          }

      - name: Compare independent unsigned QA package builds
        shell: pwsh
        env:
          SECTOR_REPRODUCIBILITY_EVIDENCE: qa-artifacts/windows-package-${{ github.run_id }}-${{ github.run_attempt }}-reproducibility.json
        run: |
          python -I -S tools/verify_reproducible_windows_builds.py `
            --root . `
            --source-revision $env:GITHUB_SHA `
            --package-a $env:SECTOR_PACKAGE_ROOT_A `
            --package-b $env:SECTOR_PACKAGE_ROOT_B `
            --source-identity-a $env:SECTOR_SOURCE_IDENTITY_A `
            --source-identity-b $env:SECTOR_SOURCE_IDENTITY_B `
            --evidence $env:SECTOR_REPRODUCIBILITY_EVIDENCE
          "SECTOR_REPRODUCIBILITY_EVIDENCE=$env:SECTOR_REPRODUCIBILITY_EVIDENCE" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload unsigned QA reproducibility evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Sector-Windows-unsigned-QA
          path: |
            ${{ env.SECTOR_PACKAGE_ROOT_A }}/
            ${{ env.SECTOR_PACKAGE_ROOT_B }}/
            ${{ env.SECTOR_SOURCE_IDENTITY_A }}
            ${{ env.SECTOR_SOURCE_IDENTITY_B }}
            ${{ env.SECTOR_REPRODUCIBILITY_EVIDENCE }}
          if-no-files-found: error
          retention-days: 7

  portable-producer-a:
    name: Unsigned portable producer A
    needs: test
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Check out source for producer A
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up producer A Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Prepare authenticated Gitless source for producer A
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $artifact = [IO.Path]::GetFullPath((
            Join-Path $env:GITHUB_WORKSPACE "qa-artifacts/portable-producer-a"
          ))
          if (Test-Path -LiteralPath $artifact) {
            throw "Producer A artifact root already exists"
          }
          New-Item -ItemType Directory -Path $artifact | Out-Null
          $sourceArchive = Join-Path $env:RUNNER_TEMP (
            "Sector portable source A [QA] & exact-{0}-{1}.zip" -f `
              $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT
          )
          $extract = Join-Path $env:RUNNER_TEMP (
            "Sector portable source A [Gitless] & exact-{0}-{1}" -f `
              $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT
          )
          $output = Join-Path $env:RUNNER_TEMP (
            "Sector portable output A [QA] & exact-{0}-{1}" -f `
              $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT
          )
          $caller = Join-Path $env:RUNNER_TEMP (
            "Portable wrapper caller A [outside] & exact-{0}-{1}" -f `
              $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT
          )
          foreach ($path in @($sourceArchive, $extract, $output, $caller)) {
            if (Test-Path -LiteralPath $path) {
              throw "Producer A create-only path already exists: $path"
            }
          }
          $sourceEvidence = & python -I -S tools/build_source_release.py `
            --root . `
            --source-revision $env:GITHUB_SHA `
            --archive $sourceArchive
          if ($LASTEXITCODE -ne 0) {
            throw "Producer A authenticated source creation failed"
          }
          Expand-Archive -LiteralPath $sourceArchive -DestinationPath $extract
          $entries = @(Get-ChildItem -LiteralPath $extract -Force)
          if ($entries.Count -ne 1 -or -not $entries[0].PSIsContainer) {
            throw "Producer A source archive must contain one root"
          }
          $source = $entries[0].FullName
          if (Test-Path -LiteralPath (Join-Path $source ".git")) {
            throw "Producer A source must be Gitless"
          }
          foreach ($required in @(
            "BUILD_SECTOR_PORTABLE.bat",
            "packaging/build_portable.ps1",
            "sector/sector_build_info.json"
          )) {
            if (-not (Test-Path -LiteralPath (Join-Path $source $required) -PathType Leaf)) {
              throw "Producer A source is missing $required"
            }
          }
          New-Item -ItemType Directory -Path $caller | Out-Null
          [IO.File]::WriteAllText(
            (Join-Path $artifact "source-release.json"),
            (($sourceEvidence -join [Environment]::NewLine) + [Environment]::NewLine),
            [Text.UTF8Encoding]::new($false)
          )
          @(
            "SECTOR_PORTABLE_SOURCE=$source"
            "SECTOR_PORTABLE_OUTPUT_ROOT=$output"
            "SECTOR_PORTABLE_CALLER=$caller"
            "SECTOR_PRODUCER_ARTIFACT=$artifact"
          ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Record Microsoft Edge prerequisite
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bases = @(
            [Environment]::GetEnvironmentVariable("ProgramFiles(x86)"),
            [Environment]::GetEnvironmentVariable("ProgramW6432"),
            [Environment]::GetEnvironmentVariable("ProgramFiles")
          ) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) }
          $candidates = @(
            $bases | ForEach-Object {
              Join-Path $_ "Microsoft/Edge/Application/msedge.exe"
            } | Where-Object {
              Test-Path -LiteralPath $_ -PathType Leaf
            } | Sort-Object -Unique
          )
          if ($candidates.Count -lt 1) {
            throw "Microsoft Edge prerequisite is not installed on the Windows runner"
          }
          $edge = Get-Item -LiteralPath $candidates[0]
          $version = [string]$edge.VersionInfo.ProductVersion
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Microsoft Edge prerequisite has no product version"
          }
          $record = [ordered]@{
            browser_bundled = $false
            executable_name = "msedge.exe"
            prerequisite = "Microsoft Edge"
            product_version = $version
            status = "present-on-windows-runner"
          }
          [IO.File]::WriteAllText(
            (Join-Path $env:SECTOR_PRODUCER_ARTIFACT "edge-prerequisite.json"),
            (($record | ConvertTo-Json -Depth 3) + [Environment]::NewLine),
            [Text.UTF8Encoding]::new($false)
          )

      - name: Build producer A through root BAT
        shell: pwsh
        env:
          CI: "true"
          SECTOR_PORTABLE_NONINTERACTIVE: "1"
          SECTOR_SOURCE_REVISION: ${{ github.sha }}
        run: |
          $ErrorActionPreference = "Stop"
          if (
            [string]::IsNullOrWhiteSpace($env:SECTOR_PORTABLE_OUTPUT_ROOT) -or
            (Test-Path -LiteralPath $env:SECTOR_PORTABLE_OUTPUT_ROOT)
          ) {
            throw "Producer A output path is unsafe"
          }
          $env:SECTOR_PORTABLE_OUTPUT = [IO.Path]::GetFullPath(
            $env:SECTOR_PORTABLE_OUTPUT_ROOT
          )
          $env:SECTOR_PORTABLE_PYTHON = (
            Get-Command python.exe -CommandType Application
          ).Source
          $wrapper = Join-Path $env:SECTOR_PORTABLE_SOURCE "BUILD_SECTOR_PORTABLE.bat"
          Push-Location -LiteralPath $env:SECTOR_PORTABLE_CALLER
          try {
            & $env:ComSpec /d /s /c ('call "{0}"' -f $wrapper)
            $exitCode = $LASTEXITCODE
          }
          finally {
            Pop-Location
          }
          if ($exitCode -ne 0) {
            throw "Producer A root-BAT build failed with exit code $exitCode"
          }

      - name: Verify and stage producer A immutable distribution
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $verification = & python -I -S tools/build_portable_windows.py `
            --root $env:SECTOR_PORTABLE_SOURCE `
            --source-revision $env:GITHUB_SHA `
            --output $env:SECTOR_PORTABLE_OUTPUT_ROOT `
            --verify-only
          if ($LASTEXITCODE -ne 0) {
            throw "Producer A verification failed"
          }
          $parsed = ($verification -join [Environment]::NewLine) | ConvertFrom-Json
          if ([string]$parsed.unsigned_status -cne "verified-pe-certificate-table-absent") {
            throw "Producer A executable is not proven unsigned"
          }
          $executable = Join-Path ([string]$parsed.folder) "Sector.exe"
          $version = (Get-Item -LiteralPath $executable).VersionInfo
          $expectedVersion = "{0}.0.0" -f [string]$parsed.sector_version
          if (
            [string]$version.ProductName -cne "Sector" -or
            [string]$version.FileDescription -cne `
              "Structural-analysis and design calculation tool" -or
            [string]$version.OriginalFilename -cne "Sector.exe" -or
            [string]$version.FileVersion -cne $expectedVersion -or
            [string]$version.ProductVersion -cne $expectedVersion -or
            [string]$version.LegalCopyright -cne `
              "Copyright (c) 2026 Kasper Lindskov Fabricius. All rights reserved." -or
            -not [string]::IsNullOrEmpty([string]$version.CompanyName)
          ) {
            throw "Producer A PE version identity differs"
          }
          $published = Join-Path $env:SECTOR_PRODUCER_ARTIFACT "distribution"
          if (Test-Path -LiteralPath $published) {
            throw "Producer A staged distribution already exists"
          }
          New-Item -ItemType Directory -Path $published | Out-Null
          foreach ($entry in @(Get-ChildItem -LiteralPath $env:SECTOR_PORTABLE_OUTPUT_ROOT -Force)) {
            Copy-Item -LiteralPath $entry.FullName -Destination $published -Recurse
          }
          $staged = & python -I -S tools/build_portable_windows.py `
            --root $env:SECTOR_PORTABLE_SOURCE `
            --source-revision $env:GITHUB_SHA `
            --output $published `
            --verify-only
          if ($LASTEXITCODE -ne 0) {
            throw "Producer A staged distribution verification failed"
          }
          [IO.File]::WriteAllText(
            (Join-Path $env:SECTOR_PRODUCER_ARTIFACT "verification.json"),
            (($staged -join [Environment]::NewLine) + [Environment]::NewLine),
            [Text.UTF8Encoding]::new($false)
          )

      - name: Upload immutable producer A distribution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sector-portable-producer-a-${{ github.run_id }}-${{ github.run_attempt }}
          path: qa-artifacts/portable-producer-a/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

