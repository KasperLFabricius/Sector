            [string]$version.FileDescription -cne `
              "Structural-analysis and design calculation tool" -or
            [string]$version.OriginalFilename -cne "Sector.exe" -or
            [string]$version.FileVersion -cne $expectedVersion -or
            [string]$version.ProductVersion -cne $expectedVersion -or
            [string]$version.LegalCopyright -cne `
              "Copyright (c) 2026 Kasper Lindskov Fabricius. All rights reserved." -or
            -not [string]::IsNullOrEmpty([string]$version.CompanyName)
          ) {
            throw "Producer B PE version identity differs"
          }
          $published = Join-Path $env:SECTOR_PRODUCER_ARTIFACT "distribution"
          if (Test-Path -LiteralPath $published) {
            throw "Producer B staged distribution already exists"
          }
          New-Item -ItemType Directory -Path $published | Out-Null
          foreach ($entry in @(Get-ChildItem -LiteralPath $env:SECTOR_PORTABLE_OUTPUT_ROOT -Force)) {
            Copy-Item -LiteralPath $entry.FullName -Destination $published -Recurse
          }
          $staged = & python -I -S tools/build_portable_windows.py `
            --root $env:SECTOR_PORTABLE_SOURCE `
            --source-revision $env:GITHUB_SHA `
            --output $published `
            --verify-only
          if ($LASTEXITCODE -ne 0) {
            throw "Producer B staged distribution verification failed"
          }
          [IO.File]::WriteAllText(
            (Join-Path $env:SECTOR_PRODUCER_ARTIFACT "verification.json"),
            (($staged -join [Environment]::NewLine) + [Environment]::NewLine),
            [Text.UTF8Encoding]::new($false)
          )

      - name: Upload immutable producer B distribution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sector-portable-producer-b-${{ github.run_id }}-${{ github.run_attempt }}
          path: qa-artifacts/portable-producer-b/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7

  portable-compare:
    name: Compare immutable portable producers
    needs:
      - portable-producer-a
      - portable-producer-b
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out source for portable comparison
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up portable comparison Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
          architecture: x64

      - name: Download immutable producer A
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sector-portable-producer-a-${{ github.run_id }}-${{ github.run_attempt }}
          path: qa-inputs/producer-a

      - name: Download immutable producer B
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sector-portable-producer-b-${{ github.run_id }}-${{ github.run_attempt }}
          path: qa-inputs/producer-b

      - name: Verify and compare downloaded portable distributions
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $distributionA = [IO.Path]::GetFullPath("qa-inputs/producer-a/distribution")
          $distributionB = [IO.Path]::GetFullPath("qa-inputs/producer-b/distribution")
          $evidence = [IO.Path]::GetFullPath("qa-artifacts/portable-comparison")
          if (Test-Path -LiteralPath $evidence) {
            throw "Portable comparison evidence already exists"
          }
          New-Item -ItemType Directory -Path $evidence | Out-Null
          $verificationA = & python -I -S tools/build_portable_windows.py `
            --root . --source-revision $env:GITHUB_SHA `
            --output $distributionA --verify-only
          if ($LASTEXITCODE -ne 0) { throw "Downloaded producer A verification failed" }
          $verificationB = & python -I -S tools/build_portable_windows.py `
            --root . --source-revision $env:GITHUB_SHA `
            --output $distributionB --verify-only
          if ($LASTEXITCODE -ne 0) { throw "Downloaded producer B verification failed" }
          $comparisonPath = Join-Path $evidence "portable-comparison.json"
          $comparison = & python -I -S tools/build_portable_windows.py `
            --compare $distributionA $distributionB `
            --comparison-evidence $comparisonPath
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $comparisonPath -PathType Leaf)) {
            throw "Immutable portable producer comparison failed"
          }
          foreach ($item in @(
            @{ Name = "verification-a.json"; Value = $verificationA },
            @{ Name = "verification-b.json"; Value = $verificationB },
            @{ Name = "comparison-cli.json"; Value = $comparison }
          )) {
            [IO.File]::WriteAllText(
              (Join-Path $evidence $item.Name),
              (($item.Value -join [Environment]::NewLine) + [Environment]::NewLine),
              [Text.UTF8Encoding]::new($false)
            )
          }

      - name: Upload portable comparison evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sector-portable-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: qa-artifacts/portable-comparison/
          if-no-files-found: error
          retention-days: 7

  portable-smoke:
    name: Isolated verified portable startup smoke
    needs:
      - portable-producer-a
      - portable-compare
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out source for isolated smoke
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up isolated smoke Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
          architecture: x64

      - name: Download verified producer A only
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sector-portable-producer-a-${{ github.run_id }}-${{ github.run_attempt }}
          path: qa-inputs/verified-producer-a

      - name: Run controlled Job Object startup smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $distribution = [IO.Path]::GetFullPath(
            "qa-inputs/verified-producer-a/distribution"
          )
          $workspace = Join-Path $env:RUNNER_TEMP (
            "Sector isolated startup [QA] & exact-{0}-{1}" -f `
              $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT
          )
          $evidence = [IO.Path]::GetFullPath("qa-artifacts/portable-smoke")
          foreach ($path in @($workspace, $evidence)) {
            if (Test-Path -LiteralPath $path) {
              throw "Smoke create-only path already exists: $path"
            }
          }
          New-Item -ItemType Directory -Path $evidence | Out-Null
          & python -I -S tools/verify_portable_startup.py `
            --root . `
            --source-revision $env:GITHUB_SHA `
            --distribution $distribution `
            --workspace $workspace `
            --timeout-seconds 120
          $startupExitCode = $LASTEXITCODE
          foreach ($name in @(
            "startup-smoke.json",
            "Sector-startup-stdout.log",
            "Sector-startup-stderr.log"
          )) {
            $source = Join-Path $workspace $name
            if (Test-Path -LiteralPath $source -PathType Leaf) {
              Copy-Item -LiteralPath $source -Destination $evidence
            }
          }
          if ($startupExitCode -ne 0) {
            throw "Controlled portable startup smoke failed"
          }
          $postSmoke = & python -I -S tools/build_portable_windows.py `
            --root . --source-revision $env:GITHUB_SHA `
            --output $distribution --verify-only
          if ($LASTEXITCODE -ne 0) {
            throw "Smoke process mutated its downloaded distribution"
          }
          $receipt = Get-Content -LiteralPath (
            Join-Path $evidence "startup-smoke.json"
          ) -Raw | ConvertFrom-Json
          $verified = ($postSmoke -join [Environment]::NewLine) | ConvertFrom-Json
          if (
            [string]$receipt.address -cne "127.0.0.1" -or
            [int]$receipt.health_status -ne 200 -or
            [string]$receipt.health_body -cne "ok" -or
            [int64]$receipt.listener_pid -le 0 -or
            [string]$receipt.browser_suppression -cne "SECTOR_HEADLESS=1" -or
            [string]$receipt.archive_sha256 -cne [string]$verified.archive_sha256
          ) {
            throw "Portable startup evidence differs"
          }
          [IO.File]::WriteAllText(
            (Join-Path $evidence "post-smoke-verification.json"),
            (($postSmoke -join [Environment]::NewLine) + [Environment]::NewLine),
            [Text.UTF8Encoding]::new($false)
          )

      - name: Upload isolated smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sector-portable-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: qa-artifacts/portable-smoke/
          if-no-files-found: warn
          retention-days: 7

  windows-portable:
    name: Unsigned portable Windows distribution
    needs:
      - portable-producer-a
      - portable-producer-b
      - portable-compare
      - portable-smoke
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out source for final portable verification
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up final portable verification Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
          architecture: x64

      - name: Download producer A for final publication
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sector-portable-producer-a-${{ github.run_id }}-${{ github.run_attempt }}
          path: qa-inputs/final-producer-a

      - name: Download producer B for final publication
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sector-portable-producer-b-${{ github.run_id }}-${{ github.run_attempt }}
          path: qa-inputs/final-producer-b

      - name: Download portable comparison evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sector-portable-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: qa-inputs/final-comparison

      - name: Download isolated smoke evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: sector-portable-smoke-${{ github.run_id }}-${{ github.run_attempt }}
          path: qa-inputs/final-smoke

      - name: Re-verify immutable distributions for final publication
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $producerA = [IO.Path]::GetFullPath("qa-inputs/final-producer-a")
          $producerB = [IO.Path]::GetFullPath("qa-inputs/final-producer-b")
          $comparison = [IO.Path]::GetFullPath("qa-inputs/final-comparison")
          $smokeInput = [IO.Path]::GetFullPath("qa-inputs/final-smoke")
          $root = [IO.Path]::GetFullPath("qa-artifacts/portable-windows")
          $distributionA = Join-Path $producerA "distribution"
          $distributionB = Join-Path $producerB "distribution"
          if (Test-Path -LiteralPath $root) {
            throw "Final portable publication root already exists"
          }
          $verificationA = & python -I -S tools/build_portable_windows.py `
            --root . --source-revision $env:GITHUB_SHA `
            --output $distributionA --verify-only
          if ($LASTEXITCODE -ne 0) { throw "Final producer A verification failed" }
          $verificationB = & python -I -S tools/build_portable_windows.py `
            --root . --source-revision $env:GITHUB_SHA `
            --output $distributionB --verify-only
          if ($LASTEXITCODE -ne 0) { throw "Final producer B verification failed" }
          $finalComparison = Join-Path $env:RUNNER_TEMP (
            "Sector final portable comparison-{0}-{1}.json" -f `
              $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT
          )
          if (Test-Path -LiteralPath $finalComparison) {
            throw "Final comparison evidence path already exists"
          }
          & python -I -S tools/build_portable_windows.py `
            --compare $distributionA $distributionB `
            --comparison-evidence $finalComparison
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath $finalComparison -PathType Leaf)) {
            throw "Final portable comparison failed"
          }
          $verifiedA = ($verificationA -join [Environment]::NewLine) | ConvertFrom-Json
          $verifiedB = ($verificationB -join [Environment]::NewLine) | ConvertFrom-Json
          $smoke = Get-Content -LiteralPath (
            Join-Path $smokeInput "startup-smoke.json"
          ) -Raw | ConvertFrom-Json
          if (
            [string]$verifiedA.archive_sha256 -cne [string]$verifiedB.archive_sha256 -or
            [string]$smoke.archive_sha256 -cne [string]$verifiedA.archive_sha256 -or
            [string]$smoke.address -cne "127.0.0.1" -or
            [int]$smoke.health_status -ne 200 -or
            [string]$smoke.health_body -cne "ok" -or
            [int64]$smoke.listener_pid -le 0
          ) {
            throw "Final portable evidence does not close over the verified archive"
          }
          New-Item -ItemType Directory -Path $root | Out-Null
          $published = Join-Path $root "distribution"
          $evidence = Join-Path $root "evidence"
          New-Item -ItemType Directory -Path $published | Out-Null
          New-Item -ItemType Directory -Path $evidence | Out-Null
          foreach ($entry in @(Get-ChildItem -LiteralPath $distributionA -Force)) {
            Copy-Item -LiteralPath $entry.FullName -Destination $published -Recurse
          }
          foreach ($item in @(
            @{ Source = $producerA; Destination = "producer-a" },
            @{ Source = $producerB; Destination = "producer-b" },
            @{ Source = $comparison; Destination = "comparison" },
            @{ Source = $smokeInput; Destination = "smoke" }
          )) {
            $destination = Join-Path $evidence $item.Destination
            New-Item -ItemType Directory -Path $destination | Out-Null
            foreach ($entry in @(Get-ChildItem -LiteralPath $item.Source -Force)) {
              if ($entry.Name -cne "distribution") {
                Copy-Item -LiteralPath $entry.FullName -Destination $destination -Recurse
              }
            }
          }
          Copy-Item -LiteralPath $finalComparison -Destination (
            Join-Path $evidence "final-portable-comparison.json"
          )
          $publishedVerification = & python -I -S tools/build_portable_windows.py `
            --root . --source-revision $env:GITHUB_SHA `
            --output $published --verify-only
          if ($LASTEXITCODE -ne 0) {
            throw "Canonical portable distribution verification failed"
          }
          $publishedRecord = (
            $publishedVerification -join [Environment]::NewLine
          ) | ConvertFrom-Json
          if (
            [string]$publishedRecord.archive_sha256 -cne `
              [string]$verifiedA.archive_sha256
          ) {
            throw "Canonical portable distribution digest differs"
          }
          foreach ($item in @(
            @{ Name = "final-verification-a.json"; Value = $verificationA },
            @{ Name = "final-verification-b.json"; Value = $verificationB },
            @{ Name = "published-verification.json"; Value = $publishedVerification }
          )) {
            [IO.File]::WriteAllText(
              (Join-Path $evidence $item.Name),
              (($item.Value -join [Environment]::NewLine) + [Environment]::NewLine),
              [Text.UTF8Encoding]::new($false)
            )
          }

      - name: Upload unsigned portable Windows evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Sector-Windows-portable-unsigned-QA
          path: qa-artifacts/portable-windows/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 7
