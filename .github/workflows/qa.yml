name: Sector QA

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sector-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Full test and report gate
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Preflight locked dependency inputs
        run: python tools/verify_dependency_audit.py quality-dependency-audit.toml --preflight-locks

      - name: Install locked QA environment
        run: python -m pip install --require-hashes -r requirements-dev.txt

      - name: Prepare QA evidence directory
        shell: pwsh
        run: New-Item -ItemType Directory -Path qa-artifacts -Force | Out-Null

      - name: Validate dependency audit policy
        env:
          SECTOR_DEPENDENCY_AUDIT_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: python tools/verify_dependency_audit.py quality-dependency-audit.toml --workflow .github/workflows/qa.yml --baseline-ref $env:SECTOR_DEPENDENCY_AUDIT_BASE

      - name: Execute locked dependency audit
        run: python tools/verify_dependency_audit.py quality-dependency-audit.toml --execute

      - name: Validate non-shrinking coverage gate
        env:
          SECTOR_COVERAGE_BASELINE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: python tools/verify_coverage_gate.py quality-coverage-gate.toml --workflow .github/workflows/qa.yml --baseline-ref $env:SECTOR_COVERAGE_BASELINE_REF

      - name: Validate Ruff policy ratchet
        env:
          SECTOR_RUFF_POLICY_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: python tools/verify_ruff_policy.py quality-ruff-policy.toml --workflow .github/workflows/qa.yml --baseline-ref $env:SECTOR_RUFF_POLICY_BASE

      - name: Execute Ruff policy
        run: python tools/verify_ruff_policy.py quality-ruff-policy.toml --execute

      - name: Validate mypy policy ratchet
        env:
          SECTOR_MYPY_POLICY_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: python tools/verify_mypy_policy.py quality-mypy-policy.toml --workflow .github/workflows/qa.yml --baseline-ref $env:SECTOR_MYPY_POLICY_BASE

      - name: Execute strict mypy policy
        run: python tools/verify_mypy_policy.py quality-mypy-policy.toml --execute

      - name: Run complete test suite with coverage
        run: python -m pytest tests -n 4 --cov=app --cov=sector --cov-report=term-missing:skip-covered --cov-report=xml:qa-artifacts/coverage.xml --cov-fail-under=90 --junitxml=qa-artifacts/test-results.xml

      - name: Render report fixture with real figures
        if: always()
        run: python tools/report_render_fixture.py --output qa-artifacts/report

      - name: Render manual fixture with real figures
        if: always()
        run: python tools/manual_render_fixture.py --output qa-artifacts/manual

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sector-qa-evidence
          path: qa-artifacts/
          if-no-files-found: error
          retention-days: 14

  windows-package:
    name: Unsigned QA Windows package
    needs: test
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Establish controlled source epoch
        shell: pwsh
        env:
          SECTOR_SOURCE_REVISION: ${{ github.sha }}
        run: |
          $ErrorActionPreference = "Stop"
          if ([string]$env:SECTOR_SOURCE_REVISION -cnotmatch '^[0-9a-f]{40}$') {
            throw "GitHub source revision must be an exact lowercase 40-hex commit"
          }
          $sourceDateEpoch = [string](git show -s --format=%ct $env:SECTOR_SOURCE_REVISION)
          if ($LASTEXITCODE -ne 0 -or $sourceDateEpoch -cnotmatch '^(0|[1-9][0-9]*)$') {
            throw "Cannot resolve the source commit timestamp"
          }
          "SOURCE_DATE_EPOCH=$sourceDateEpoch" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Install locked build environment
        run: python -m pip install --require-hashes -r requirements-build.txt

      - name: Build unsigned QA package
        shell: pwsh
        env:
          SECTOR_SOURCE_REVISION: ${{ github.sha }}
        run: |
          Write-Warning "UNSIGNED QA PACKAGE ONLY. Do not launch or distribute this artifact."
          python tools/generate_third_party_notices.py --output build/legal/THIRD_PARTY_NOTICES.txt
          python -m PyInstaller --noconfirm --clean --distpath dist --workpath build/primary packaging/sector.spec
          python -I -S tools/canonicalize_pyinstaller_archive.py --archive dist/Sector/_internal/base_library.zip
          Copy-Item -LiteralPath LICENSE -Destination dist/Sector/LICENSE.txt -Force
          Copy-Item -LiteralPath build/legal/THIRD_PARTY_NOTICES.txt -Destination dist/Sector/THIRD_PARTY_NOTICES.txt -Force
          python -m PyInstaller --noconfirm --clean --distpath dist/repro-check --workpath build/repro-check packaging/sector.spec
          python -I -S tools/canonicalize_pyinstaller_archive.py --archive dist/repro-check/Sector/_internal/base_library.zip
          Copy-Item -LiteralPath LICENSE -Destination dist/repro-check/Sector/LICENSE.txt -Force
          Copy-Item -LiteralPath build/legal/THIRD_PARTY_NOTICES.txt -Destination dist/repro-check/Sector/THIRD_PARTY_NOTICES.txt -Force

      - name: Verify unsigned QA package contents and identity
        shell: pwsh
        run: |
          python -I -S tools/verify_windows_release.py --root . --package dist/Sector --source-revision $env:GITHUB_SHA --source-date-epoch $env:SOURCE_DATE_EPOCH
          python -I -S tools/verify_windows_release.py --root . --package dist/repro-check/Sector --source-revision $env:GITHUB_SHA --source-date-epoch $env:SOURCE_DATE_EPOCH
          python -I -S tools/verify_package_reproducibility.py --first dist/Sector --second dist/repro-check/Sector --source-revision $env:GITHUB_SHA --source-date-epoch $env:SOURCE_DATE_EPOCH --output build/reproducibility/package-reproducibility.json

          if (-not (Test-Path -LiteralPath "dist/Sector/Sector.exe")) {
            throw "Sector.exe was not produced"
          }
          if (-not (Test-Path -LiteralPath "dist/Sector/_internal/app/sector_app.py")) {
            throw "Packaged app source is missing"
          }
          if (-not (Test-Path -LiteralPath "dist/Sector/_internal/sector/__init__.py")) {
            throw "Packaged numerical core is missing"
          }
          if (-not (Test-Path -LiteralPath "dist/Sector/_internal/sector/sector_build_info.json")) {
            throw "Packaged source-provenance manifest is missing"
          }
          if (-not (Test-Path -LiteralPath "dist/Sector/LICENSE.txt")) {
            throw "Sector proprietary notice is missing"
          }
          if (-not (Test-Path -LiteralPath "dist/Sector/THIRD_PARTY_NOTICES.txt")) {
            throw "Third-party notice bundle is missing"
          }

          $versionInfo = (Get-Item -LiteralPath "dist/Sector/Sector.exe").VersionInfo
          $expectedVersionInfo = [ordered]@{
            ProductName = "Sector"
            FileDescription = "Structural-analysis and design calculation tool"
            FileVersion = "0.91.0.0"
            ProductVersion = "0.91.0.0"
            OriginalFilename = "Sector.exe"
            LegalCopyright = "Copyright (c) 2026 Kasper Lindskov Fabricius. All rights reserved."
          }
          foreach ($field in $expectedVersionInfo.Keys) {
            if ([string]$versionInfo.$field -ne [string]$expectedVersionInfo[$field]) {
              throw "Unexpected Windows identity field $field"
            }
          }
          if (-not [string]::IsNullOrWhiteSpace([string]$versionInfo.CompanyName)) {
            throw "Sector.exe must not advertise a company or publisher identity"
          }

          $manifest = Get-Content -LiteralPath "dist/Sector/_internal/sector/sector_build_info.json" -Raw | ConvertFrom-Json
          $expectedManifest = [ordered]@{
            product_name = "Sector"
            description = "Structural-analysis and design calculation tool"
            sector_version = "0.91"
            source_revision = $env:GITHUB_SHA
            author = "Kasper Lindskov Fabricius"
            licensee = "Sweco Danmark A/S"
            copyright = "Copyright (c) 2026 Kasper Lindskov Fabricius. All rights reserved."
          }
          foreach ($field in $expectedManifest.Keys) {
            if ([string]$manifest.$field -ne [string]$expectedManifest[$field]) {
              throw "Unexpected package manifest field $field"
            }
          }

      - name: Upload unsigned QA package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Sector-Windows-unsigned-QA
          path: dist/Sector/
          if-no-files-found: error
          retention-days: 7

      - name: Upload controlled-build reproducibility evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Sector-Windows-reproducibility-QA
          path: build/reproducibility/package-reproducibility.json
          if-no-files-found: error
          retention-days: 14
