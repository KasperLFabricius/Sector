name: Sector QA

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sector-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    name: Fast source preflight
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
    - name: Check out source
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        fetch-depth: 0
    - name: Set up pinned Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version-file: .python-version
        cache: pip
        cache-dependency-path: requirements-dev.txt
    - name: Preflight locked dependency inputs
      run: python tools/verify_dependency_audit.py quality-dependency-audit.toml --preflight-locks
    - name: Install locked QA environment
      run: python -m pip install --require-hashes -r requirements-dev.txt
    - name: Run fast source contracts
      run: python -m pytest tests/test_ascii_only.py tests/test_real_image_export_policy.py -n 0 -q

  core:
    needs: preflight
    name: Primary pytest (${{ matrix.shard }})
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard:
        - core-01
        - core-02
        - core-03
        - core-04
        - core-05
        - core-06
        - core-07
        - core-08
        - core-09
        - core-10
        - core-11
        - core-12
        - branch-01
        - branch-02
        - branch-03
        - branch-04
        - real
    steps:
    - name: Check out source
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        fetch-depth: 0
    - name: Set up pinned Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version-file: .python-version
        cache: pip
        cache-dependency-path: requirements-dev.txt
    - name: Preflight locked dependency inputs
      run: python tools/verify_dependency_audit.py quality-dependency-audit.toml --preflight-locks
    - name: Install locked QA environment
      run: python -m pip install --require-hashes -r requirements-dev.txt
    - name: Run complete primary shard
      run: python tools/qa_core_shards.py run --shard "${{ matrix.shard }}" --output qa-shard
    - name: Upload raw primary shard evidence
      if: always()
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: sector-core-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
        path: qa-shard/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 7

  test:
    needs: core
    if: always()
    name: Full test and report gate
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Preflight locked dependency inputs
        run: python tools/verify_dependency_audit.py quality-dependency-audit.toml --preflight-locks

      - name: Install locked QA environment
        run: python -m pip install --require-hashes -r requirements-dev.txt

      - name: Prepare QA evidence directory
        shell: pwsh
        run: New-Item -ItemType Directory -Path qa-artifacts -Force | Out-Null

      - name: Validate dependency audit policy
        env:
          SECTOR_DEPENDENCY_AUDIT_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: python tools/verify_dependency_audit.py quality-dependency-audit.toml --workflow .github/workflows/qa.yml --baseline-ref $env:SECTOR_DEPENDENCY_AUDIT_BASE

      - name: Execute locked dependency audit
        run: python tools/verify_dependency_audit.py quality-dependency-audit.toml --execute

      - name: Validate non-shrinking coverage gate
        env:
          SECTOR_COVERAGE_BASELINE_REF: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: python tools/verify_coverage_gate.py quality-coverage-gate.toml --workflow .github/workflows/qa.yml --baseline-ref $env:SECTOR_COVERAGE_BASELINE_REF

      - name: Validate Ruff policy ratchet
        env:
          SECTOR_RUFF_POLICY_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: python tools/verify_ruff_policy.py quality-ruff-policy.toml --workflow .github/workflows/qa.yml --baseline-ref $env:SECTOR_RUFF_POLICY_BASE

      - name: Execute Ruff policy
        run: python tools/verify_ruff_policy.py quality-ruff-policy.toml --execute

      - name: Validate mypy policy ratchet
        env:
          SECTOR_MYPY_POLICY_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
        run: python tools/verify_mypy_policy.py quality-mypy-policy.toml --workflow .github/workflows/qa.yml --baseline-ref $env:SECTOR_MYPY_POLICY_BASE

      - name: Execute strict mypy policy
        run: python tools/verify_mypy_policy.py quality-mypy-policy.toml --execute

      - name: Download exact core shard evidence
        id: core_download
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: sector-core-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: qa-core-inputs
          merge-multiple: false

      - name: Run complete test suite with coverage
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $phaseFailures = @()
          if ("${{ steps.core_download.outcome }}" -ne "success") {
            $phaseFailures += "core artifact download"
          }

          python tools/qa_core_shards.py merge --input qa-core-inputs --output qa-artifacts
          $phaseExit = $LASTEXITCODE
          if ($phaseExit -ne 0) {
            $phaseFailures += "parallel test shards ($phaseExit)"
          }

          python -m coverage xml -o qa-artifacts/coverage.xml
          $phaseExit = $LASTEXITCODE
          if ($phaseExit -ne 0) {
            $phaseFailures += "coverage XML ($phaseExit)"
          }

          python -m coverage report --show-missing --skip-covered --fail-under=90
          $phaseExit = $LASTEXITCODE
          if ($phaseExit -ne 0) {
            $phaseFailures += "coverage floor ($phaseExit)"
          }

          if ($phaseFailures.Count -gt 0) {
            throw "QA phases failed: $($phaseFailures -join ', ')"
          }

      - name: Run decision-branch coverage gate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python tools/verify_coverage_gate.py quality-coverage-gate.toml --results qa-artifacts/branch-coverage.json
          if ($LASTEXITCODE -ne 0) {
            throw "Decision-branch coverage floor failed ($LASTEXITCODE)"
          }

      - name: Upload QA diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sector-qa-${{ github.run_id }}
          include-hidden-files: true
          path: qa-artifacts/
          if-no-files-found: error
          retention-days: 7

  portable:
    name: Build and run portable Sector
    needs: [core, test]
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-build.txt

      - name: Build once and execute the packaged first page
        shell: pwsh
        env:
          SECTOR_PORTABLE_NONINTERACTIVE: "1"
          SECTOR_SOURCE_REVISION: ${{ github.sha }}
        run: |
          $env:SECTOR_PORTABLE_PYTHON = [IO.Path]::GetFullPath(
            (Join-Path $env:pythonLocation "python.exe")
          )
          $env:SECTOR_PORTABLE_OUTPUT = Join-Path $env:RUNNER_TEMP (
            "sector-portable-$env:GITHUB_RUN_ID"
          )
          & (Join-Path $env:GITHUB_WORKSPACE "BUILD.bat")
          if ($LASTEXITCODE -ne 0) {
            throw "BUILD.bat failed with exit code $LASTEXITCODE"
          }
          $zip = @(Get-ChildItem $env:SECTOR_PORTABLE_OUTPUT -File -Filter "*.zip")
          $sha = @(Get-ChildItem $env:SECTOR_PORTABLE_OUTPUT -File -Filter "*.zip.sha256")
          if ($zip.Count -ne 1 -or $sha.Count -ne 1) {
            throw "Expected one portable ZIP and checksum"
          }
          "SECTOR_PORTABLE_OUTPUT=$env:SECTOR_PORTABLE_OUTPUT" | Out-File `
            -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload portable ZIP
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Sector-v0.96.9-windows-portable-${{ github.run_id }}
          path: |
            ${{ env.SECTOR_PORTABLE_OUTPUT }}/*.zip
            ${{ env.SECTOR_PORTABLE_OUTPUT }}/*.zip.sha256
          if-no-files-found: error
          retention-days: 14
