# Weekly update pull requests for the hash-locked pip-compile files and the
# SHA-pinned GitHub Actions. Each update runs the full QA workflow. The exact
# Python pin in .python-version is updated by hand.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Also refresh the transitive pins of the locks (pillow, certifi, ...).
    allow:
      - dependency-type: all
    groups:
      python-minor-and-patch:
        update-types:
          - minor
          - patch
        # tests/native_callable_page_client.py accepts one reviewed Streamlit
        # release, so each Streamlit update comes as its own pull request.
        exclude-patterns:
          - streamlit
  # One pull request for each action. The policy validators in tools/ pin the
  # SHAs of actions/checkout and actions/setup-python: an update of these two
  # also changes those constants (see AGENTS.md).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
