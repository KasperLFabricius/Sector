[tool.mypy]
python_version = "3.13"
strict = true
follow_imports = "silent"
incremental = false
files = [
    "sector/bridge.py",
    "app/bridge_analysis.py",
    "app/manual_equation_contract.py",
    "app/manual_equation_publication.py",
    "sector/design_standards.py",
    "app/modelled_direction.py",
    "sector/heightened_crack_control.py",
    "app/publication_equation_layout.py",
]

[sector_policy]
schema_version = 1

[[sector_policy.waivers]]
id = "mypy-imported-module-debt"
setting = "follow_imports"
value = "silent"
owner = "PR-13 F-012 type-gate owner"
reason = "The ratchet owns retained decommission markers and typed publication/standards boundaries without importing unrelated legacy type errors."
exit_condition = "Remove after imported modules pass strict mypy and follow_imports can be strengthened to normal."
