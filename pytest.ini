[pytest]
pythonpath = .
# For a fast full gate, add `-n auto` (needs pytest-xdist, in requirements-dev.txt):
#   python -m pytest -n auto
# Left out of addopts on purpose so a single-test run does not spawn workers.
addopts = -p no:cacheprovider
testpaths = tests
norecursedirs = .git __pycache__ .pytest_cache .pytest_* build dist tmp
markers =
    real_image_export: launches the real Kaleido/Chromium image exporter and must run in an isolated serial interpreter
